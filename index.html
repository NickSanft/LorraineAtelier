<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lorraine Atelier — dev</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; height: 100vh; font-family: "Segoe UI", system-ui, sans-serif;
        background: #15121d; color: #efe6d2; display: flex; flex-direction: column;
        gap: 14px; padding: 18px 20px; box-sizing: border-box;
      }
      h1 { font-size: 16px; margin: 0; letter-spacing: .18em; text-transform: uppercase;
           color: #e8b84a; font-weight: 600; }
      .sub { font-size: 12px; opacity: .6; margin-top: -8px; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; }
      button {
        background: #241c34; color: #efe6d2; border: 1px solid #4a3b63;
        border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer;
      }
      button:hover { border-color: #e8b84a; }
      #log {
        flex: 1; overflow: auto; background: #0d0a14; border: 1px solid #2a2238;
        border-radius: 8px; padding: 10px; font: 11px/1.5 "Cascadia Code", monospace;
        white-space: pre-wrap; color: #b9aed0;
      }
      .hint { font-size: 11px; opacity: .55; }
    </style>
  </head>
  <body>
    <h1>Lorraine Atelier</h1>
    <div class="sub">Slice&nbsp;1 — wallpaper attachment harness</div>
    <div class="row">
      <button id="reattach">Re-attach wallpaper</button>
      <button id="overlay">Show casting overlay</button>
      <button id="detach">Detach</button>
    </div>
    <div class="hint">Global hotkey: <b>Ctrl+Alt+W</b> toggles the casting overlay. Closing this window hides it to the tray.</div>
    <div id="log">booting…</div>
    <script type="module" src="/src/control.ts"></script>
  </body>
</html>
