<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lorraine Atelier</title>
    <link rel="stylesheet" href="/fonts/atelier-fonts.css" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; font-family: "EB Garamond", serif;
        background: #15121d; color: #efe6d2; padding: 18px 20px;
        display: flex; flex-direction: column; gap: 13px;
        --gold: #e8b84a; --edge: #4a3b63; --panel: #1d1830;
      }
      h1 { font-family: "Cinzel", serif; font-size: 15px; margin: 0; letter-spacing: .26em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
      .sub { font-size: 12px; opacity: .55; margin-top: -9px; font-style: italic; }
      .panel { border: 1px solid var(--edge); background: var(--panel); border-radius: 10px; padding: 11px 13px; display: flex; flex-direction: column; gap: 10px; }
      .panel h2 { font-family: "Cinzel", serif; font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin: 0; opacity: .85; }
      .toggles { display: flex; gap: 9px; flex-wrap: wrap; }
      button { font-family: "Cinzel", serif; font-size: 11px; letter-spacing: .06em; background: #241c34; color: #efe6d2; border: 1px solid var(--edge); border-radius: 8px; padding: 9px 14px; cursor: pointer; }
      button:hover { border-color: var(--gold); }
      button.on { border-color: var(--gold); background: rgba(232,184,74,.14); color: #f5d27e; }
      .dev { display: flex; gap: 8px; flex-wrap: wrap; }
      .dev button { font-size: 10px; opacity: .82; }
      #bindings { display: flex; flex-direction: column; gap: 8px; }
      .brow { display: flex; align-items: center; gap: 10px; }
      .brow .bg { font-size: 18px; width: 22px; text-align: center; line-height: 1; }
      .brow .bn { font-family: "Cinzel", serif; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); width: 52px; }
      .brow input { flex: 1; min-width: 0; background: #15121d; border: 1px solid var(--edge); border-radius: 6px; color: #efe6d2; padding: 6px 8px; font: 12px/1.3 "Cascadia Code", monospace; }
      .brow input:focus { outline: none; border-color: var(--gold); }
      .brow .test { font-size: 9px; padding: 6px 11px; }
      #log { flex: 1; min-height: 84px; overflow: auto; background: #0d0a14; border: 1px solid #2a2238; border-radius: 8px; padding: 9px; font: 11px/1.5 "Cascadia Code", monospace; white-space: pre-wrap; color: #b9aed0; }
      .hint { font-size: 11px; opacity: .5; }
    </style>
  </head>
  <body>
    <h1>Lorraine Atelier</h1>
    <div class="sub">とんがり帽子のアトリエ — control</div>

    <div class="panel">
      <h2>Atelier</h2>
      <div class="toggles">
        <button id="mode">☾ Night</button>
        <button id="attune">▶ Attune</button>
        <button id="pause">Pause on fullscreen: off</button>
        <button id="interact">Desktop interactivity: off</button>
        <button id="preview">Preview dedication</button>
      </div>
    </div>

    <!-- Spell Bindings panel (populated by control.ts) -->
    <div class="panel" id="bindingsPanel" style="display:none">
      <h2>Spell Bindings</h2>
      <div id="bindings"></div>
      <div class="dev"><button id="resetBindings">Reset to defaults</button></div>
    </div>

    <div class="panel">
      <h2>Wallpaper</h2>
      <div class="dev">
        <button id="reattach">Re-attach</button>
        <button id="overlay">Casting overlay</button>
        <button id="detach">Detach</button>
      </div>
      <div class="hint">Ctrl+Alt+W toggles the casting overlay. Closing this window hides it to the tray.</div>
    </div>

    <div id="log">booting…</div>
    <script type="module" src="/src/control.ts"></script>
  </body>
</html>
