[package]
name = "lorraine-atelier"
version = "0.0.0"
description = "Witch Hat Atelier live wallpaper"
edition = "2021"
rust-version = "1.77"

[lib]
name = "lorraine_atelier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }

[features]
# Serve the embedded frontend (../dist) instead of the dev server. `tauri build`
# enables this; we also pass it to `cargo build` for production-mode test runs.
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# For the recognizer golden-corpus parity test (tests/recognizer_parity.rs).
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
] }
# For reparenting the WebView2 controller into our host windows (so the wallpaper
# survives an explorer restart without a reload). Must match the version wry uses.
webview2-com = "0.38"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
