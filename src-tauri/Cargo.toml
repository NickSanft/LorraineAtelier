[package]
name = "lorraine-atelier"
version = "1.0.0"
description = "Witch Hat Atelier live wallpaper"
edition = "2021"
rust-version = "1.77"

[lib]
name = "lorraine_atelier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Serve the embedded frontend (../dist) instead of the dev server. `tauri build`
# enables this; we also pass it to `cargo build` for production-mode test runs.
custom-protocol = ["tauri/custom-protocol"]


[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
] }
# For reparenting the WebView2 controller into our host windows (so the wallpaper
# survives an explorer restart without a reload). Must match the version wry uses.
webview2-com = "0.38"
# Audio visualizer (Phase 6): WASAPI loopback capture + FFT band analysis. The
# `wasapi` crate is used for loopback (cpal 0.15 loopback is unreliable, cpal #476).
wasapi = "0.15"
realfft = "3"
# Run-at-startup: we drop a shortcut in the per-user Startup folder. A .lnk stores
# target + arguments as SEPARATE fields (immune to the installed path's space) and,
# unlike an HKCU Run value, actually launches our exe at logon (the Run-key path
# silently failed for this exe; the Startup shortcut is the robust method). See
# src/autostart.rs.
mslnk = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# unwind (not abort) so a panic in a worker thread (buddy/watchdog/birthday/power)
# terminates only that thread instead of the whole app, and catch_unwind guards on
# the critical recovery work can recover a bad tick. Crash-resilience (Phase 13.4).
panic = "unwind"
strip = true
