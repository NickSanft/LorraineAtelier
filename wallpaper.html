<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atelier wallpaper</title>
    <!-- Self-hosted Cinzel + EB Garamond (works offline; no Google Fonts dependency). -->
    <link rel="stylesheet" href="/fonts/atelier-fonts.css" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0914;
        font-family: "EB Garamond", serif; -webkit-font-smoothing: antialiased; }
      @keyframes wha-spin { to { transform: rotate(360deg); } }
      @keyframes wha-spin-rev { to { transform: rotate(-360deg); } }
      canvas { display: block; }
      /* Element colours (Fire/Water/Wind/Earth/Light) routed through vars so the
         colorblind toggle can swap them to an Okabe-Ito safe palette. */
      :root { --el-fire: #e8954a; --el-water: #5a93f0; --el-wind: #2fd6c6; --el-earth: #c79a4c; --el-light: #f5d27e; }
      body.cb { --el-fire: #d55e00; --el-water: #0072b2; --el-wind: #009e73; --el-earth: #e69f00; --el-light: #f0e442; }
      /* Vertical dock: cascade column direction through the dock's nested flex rows so
         every icon (ink, the four glyphs, Inscribe, Tomes, mode) stacks top-to-bottom. */
      #dock.dock-vertical, #dock.dock-vertical > div, #dock.dock-vertical > div > div { flex-direction: column; align-items: center; }
    </style>
  </head>
  <body>
    <!-- Root carries NIGHT palette vars inline so the wallpaper loads dark (no day→night flash). -->
    <div id="root" style="position:fixed;inset:0;overflow:hidden;font-family:'EB Garamond',serif;--c-text:#efe6d2;--c-soft:rgba(239,230,210,.66);--c-faint:rgba(239,230,210,.4);--c-panel:rgba(22,20,36,.6);--c-panel-2:rgba(22,20,36,.82);--c-edge:rgba(232,184,74,.42);--c-gold:#e8b84a;--c-gold-2:#f5d27e;--c-teal:#2fd6c6;--c-ink:#0d0b16;--c-halo:rgba(11,9,20,.62);color:var(--c-text)">

      <img id="wall" src="/wallpaper.webp" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.58) saturate(.85) contrast(1.02);transition:filter 1.1s ease" />
      <div id="tint" style="position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;background:radial-gradient(125% 120% at 50% 38%, rgba(44,32,72,.55), rgba(10,8,20,.8));opacity:.92;transition:opacity 1.1s ease, background 1.1s ease"></div>
      <div id="glow" style="position:absolute;left:50%;bottom:6%;width:60vw;height:60vw;transform:translateX(-50%);pointer-events:none;border-radius:50%;background:radial-gradient(circle, rgba(47,214,198,.5), rgba(47,214,198,0) 62%);mix-blend-mode:screen;opacity:0;will-change:opacity"></div>
      <canvas id="ambient" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></canvas>
      <div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 120% at 50% 42%, rgba(0,0,0,0) 46%, rgba(8,6,14,.5) 100%)"></div>
      <!-- Cast bloom: the origami unfold driven by the Rust `cast:fire` event (all monitors). -->
      <canvas id="bloom" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:45"></canvas>

      <!-- TOP STRIP (display only; hidden on secondary monitors) -->
      <!-- Top pills: a full-area layer holding two independently-placeable pills
           (title + glyphs-inscribed); each is its own widget-layout target. -->
      <div id="topstrip" style="position:absolute;inset:0;pointer-events:none;z-index:30;text-shadow:0 0 8px var(--c-halo),0 1px 2px var(--c-halo)">
        <div id="titlePill" style="position:absolute;left:26px;top:10px;transform:scale(var(--ui-scale,1));transform-origin:top left;display:flex;align-items:baseline;gap:12px;padding:6px 16px;border-radius:999px;border:1px solid var(--c-edge);background:var(--c-panel);backdrop-filter:blur(7px);box-shadow:0 6px 20px rgba(8,6,14,.28)">
          <span style="font-family:'EB Garamond',serif;font-size:18px;color:var(--c-text);opacity:.92">とんがり帽子のアトリエ</span>
          <span style="font-family:'Cinzel',serif;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--c-soft)">Atelier</span>
        </div>
        <div id="glyphsPill" style="position:absolute;right:26px;top:10px;transform:scale(var(--ui-scale,1));transform-origin:top right;display:flex;align-items:center;gap:8px;font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--c-soft);padding:6px 16px;border-radius:999px;border:1px solid var(--c-edge);background:var(--c-panel);backdrop-filter:blur(7px);box-shadow:0 6px 20px rgba(8,6,14,.28)">
          <span style="color:var(--c-gold);font-family:'EB Garamond',serif;font-size:14px;letter-spacing:0">✦</span>
          <span><span id="glyphcount">0</span> / 4 glyphs inscribed</span>
        </div>
      </div>

      <!-- CLOCK MAGIC CIRCLE (display only) -->
      <div id="clock" style="position:absolute;left:46px;top:84px;width:286px;height:286px;z-index:20;filter:drop-shadow(0 6px 22px rgba(8,6,14,.4));transform:scale(var(--ui-scale,1));transform-origin:top left">
        <div style="position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle, var(--c-halo) 44%, rgba(0,0,0,0) 80%);backdrop-filter:blur(2px)"></div>
        <svg id="ring1" viewBox="0 0 300 300" style="position:absolute;inset:0;width:100%;height:100%;color:var(--c-gold);will-change:transform">
          <circle cx="150" cy="150" r="142" fill="none" stroke="currentColor" stroke-width="1" opacity=".55" />
          <circle cx="150" cy="150" r="142" fill="none" stroke="currentColor" stroke-width="2.4" stroke-dasharray="1.6 13.2" opacity=".7" />
          <circle cx="150" cy="150" r="120" fill="none" stroke="currentColor" stroke-width=".8" opacity=".4" />
          <g opacity=".62" font-family="Cinzel, serif" font-size="13" fill="currentColor" text-anchor="middle">
            <text x="150" y="40">△</text><text x="262" y="155">□</text><text x="150" y="272">▽</text><text x="42" y="155">○</text>
          </g>
        </svg>
        <svg id="ring2" viewBox="0 0 300 300" style="position:absolute;inset:22px;width:calc(100% - 44px);height:calc(100% - 44px);color:var(--c-gold);will-change:transform">
          <circle cx="150" cy="150" r="126" fill="none" stroke="currentColor" stroke-width="1" opacity=".4" />
          <circle cx="150" cy="150" r="126" fill="none" stroke="currentColor" stroke-width="6" stroke-dasharray=".5 30.5" stroke-linecap="round" opacity=".55" />
          <g stroke="currentColor" stroke-width=".7" opacity=".3">
            <line x1="150" y1="24" x2="150" y2="276" /><line x1="24" y1="150" x2="276" y2="150" />
            <line x1="62" y1="62" x2="238" y2="238" /><line x1="238" y1="62" x2="62" y2="238" />
          </g>
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
          <div id="weekday" style="font-family:'EB Garamond',serif;font-size:11px;letter-spacing:.36em;text-transform:uppercase;color:var(--c-soft);margin-bottom:2px;text-shadow:0 0 12px var(--c-halo)"></div>
          <div style="display:flex;align-items:baseline;gap:6px;font-family:'EB Garamond',serif;font-weight:500;line-height:1;color:var(--c-text);text-shadow:0 0 18px var(--c-halo),0 1px 3px var(--c-halo)">
            <span id="time" style="font-size:52px;letter-spacing:.01em"></span>
            <span id="ampm" style="font-size:15px;letter-spacing:.18em;color:var(--c-gold);font-family:'Cinzel',serif;font-weight:600"></span>
          </div>
          <div id="date" style="font-family:'Cinzel',serif;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--c-soft);margin-top:8px;text-shadow:0 0 12px var(--c-halo)"></div>
        </div>
      </div>

      <!-- VISUALIZER SEAL (display only; Attune pill is non-interactive on the wallpaper) -->
      <div id="seal" style="position:absolute;left:70px;bottom:150px;width:300px;height:300px;z-index:20;transform:scale(var(--ui-scale,1));transform-origin:bottom left">
        <div style="position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle, var(--c-halo), rgba(0,0,0,0) 68%);backdrop-filter:blur(2px)"></div>
        <svg id="ring3" viewBox="0 0 300 300" style="position:absolute;inset:-10px;width:calc(100% + 20px);height:calc(100% + 20px);color:var(--c-teal);opacity:.4;will-change:transform">
          <circle cx="150" cy="150" r="146" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="1 9" />
        </svg>
        <!-- The canvas extends 80px beyond the seal box (centred) so the resonance ripples
             have room to expand and fade out cleanly instead of clipping at the widget edge.
             A <canvas> is a replaced element, so it needs explicit width/height (inset alone
             leaves it at its intrinsic size). -->
        <canvas id="viz" style="position:absolute;top:-80px;left:-80px;width:calc(100% + 160px);height:calc(100% + 160px);pointer-events:none"></canvas>
        <div style="position:absolute;left:0;right:0;bottom:-34px;display:flex;align-items:center;justify-content:center;gap:12px;pointer-events:none">
          <div id="attunePill" style="display:flex;align-items:center;gap:9px;border:1px solid var(--c-edge);background:var(--c-panel);backdrop-filter:blur(7px);border-radius:999px;padding:7px 16px 7px 11px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--c-text)">
            <span id="attuneIcon" style="display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;color:var(--c-gold);font-size:11px">▶</span>
            <span id="attuneLabel">Attune</span>
          </div>
        </div>
      </div>

      <!-- BRUSHBUDDY — the canon fudemushi: a fuzzy long-tailed ink-brush familiar.
           SWAPPABLE: set the `buddySprite` setting to a path/URL to replace the
           built-in sprite below with your own image (see #buddyImg + wallpaper.ts).
           Skin colours are driven by the --buddy-* vars on this container. -->
      <div id="buddy" style="position:absolute;left:0;top:0;width:88px;height:45px;z-index:22;pointer-events:none;will-change:transform;opacity:0;transition:opacity .35s ease;--body:#2a2420;--ink:#0e0a07;--rim:#d8cdb6;--patch:#473c30;--feet:#15110c">
        <svg id="buddySvg" viewBox="0 0 48 42" style="width:100%;height:100%;overflow:visible">
          <ellipse cx="22" cy="39.6" rx="18" ry="2.1" fill="rgba(10,7,4,.28)" />
          <g stroke="var(--ink)" stroke-width="4" stroke-linecap="round"><path d="M19 30 l-0.5 6.6" /><path d="M26.5 31 l-0.3 6.8" /><path d="M34 31 l0.2 6.8" /><path d="M42 30 l0.6 6.4" /></g>
          <g stroke="var(--body)" stroke-width="2.6" stroke-linecap="round"><path d="M19 30 l-0.5 6.6" /><path d="M26.5 31 l-0.3 6.8" /><path d="M34 31 l0.2 6.8" /><path d="M42 30 l0.6 6.4" /></g>
          <g fill="var(--feet)"><ellipse cx="18.4" cy="37.6" rx="2.5" ry="1.7" /><ellipse cx="26" cy="38.1" rx="2.5" ry="1.7" /><ellipse cx="34.2" cy="38.1" rx="2.5" ry="1.7" /><ellipse cx="42.7" cy="37.3" rx="2.5" ry="1.7" /></g>
          <path d="M30 23 C22 31 13 31 8 25 C6.4 22.6 6.4 19.4 8.6 17.4" fill="none" stroke="var(--ink)" stroke-width="14" stroke-linecap="round" />
          <path d="M30 23 C22 31 13 31 8 25 C6.4 22.6 6.4 19.4 8.6 17.4" fill="none" stroke="var(--body)" stroke-width="11.4" stroke-linecap="round" />
          <ellipse cx="36" cy="16" rx="10.6" ry="11.6" fill="var(--body)" stroke="var(--ink)" stroke-width="1.3" />
          <g stroke="var(--rim)" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.85"><path d="M28 8 C32 5.6 38 5.6 43 9" /><path d="M22 16.5 C16 16.5 11 18.5 8.6 21.4" /></g>
          <g stroke="var(--ink)" stroke-width="0.9" stroke-linecap="round" fill="none"><path d="M31 6 l-1 -3" /><path d="M36 4.4 l0 -3" /><path d="M41 6 l1.5 -2.6" /><path d="M22 15.6 l-1 -2.6" /><path d="M14 17.6 l-1.4 -2.4" /></g>
          <g id="buddyEyes">
            <circle cx="32.5" cy="14.5" r="4" fill="#f4ecd9" stroke="var(--ink)" stroke-width="0.7" /><circle cx="40" cy="14.5" r="4" fill="#f4ecd9" stroke="var(--ink)" stroke-width="0.7" />
            <circle cx="33" cy="15" r="2.5" fill="#1a140e" /><circle cx="40.5" cy="15" r="2.5" fill="#1a140e" />
            <circle cx="32.2" cy="13.7" r="0.85" fill="#fff" /><circle cx="39.7" cy="13.7" r="0.85" fill="#fff" />
          </g>
        </svg>
        <img id="buddyImg" alt="" style="display:none;width:100%;height:100%;object-fit:contain;overflow:visible" />
      </div>

      <!-- WITCH'S BELT DOCK / DockMirror (display-only; no input handlers per hard platform constraint) -->
      <div id="dock" style="position:absolute;left:50%;bottom:26px;transform:translateX(-50%) scale(var(--ui-scale,1));transform-origin:center bottom;z-index:25;display:flex;align-items:stretch;gap:14px;pointer-events:none;text-shadow:0 0 6px var(--c-halo)">

        <!-- Spell vials + ink reservoir -->
        <div style="display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:16px;border:1px solid var(--c-edge);background:var(--c-panel);backdrop-filter:blur(9px);box-shadow:0 10px 34px rgba(8,6,14,.32)">
          <!-- ink vial gauge -->
          <div style="display:flex;flex-direction:column;align-items:center;gap:5px">
            <div style="position:relative;width:20px;height:40px;border:1.4px solid var(--c-edge);border-radius:4px 4px 7px 7px;overflow:hidden;background:rgba(0,0,0,.12)">
              <div id="inkLevel" style="position:absolute;left:0;right:0;bottom:0;height:78%;background:linear-gradient(180deg, var(--c-teal), #145b6e);transition:height .5s ease"></div>
            </div>
            <span style="font-family:'Cinzel',serif;font-size:calc(8px * var(--ui-scale,1));letter-spacing:.18em;text-transform:uppercase;color:var(--c-soft)">Ink</span>
          </div>
          <div style="width:1px;align-self:stretch;background:var(--c-edge);opacity:.6"></div>
          <!-- spell vials (Fire △, Water ▽, Wind ○, Earth □) -->
          <div style="display:flex;gap:4px">
            <div data-pill="fire" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 10px;white-space:nowrap;color:var(--c-text)">
              <span style="font-size:calc(21px * var(--ui-scale,1));line-height:1;color:var(--el-fire);text-shadow:0 0 12px rgba(232,149,74,.6)">△</span>
              <span style="font-family:'Cinzel',serif;font-size:calc(8.5px * var(--ui-scale,1));letter-spacing:.12em;text-transform:uppercase;color:var(--c-soft)">Steam</span>
            </div>
            <div data-pill="water" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 10px;white-space:nowrap;color:var(--c-text)">
              <span style="font-size:calc(21px * var(--ui-scale,1));line-height:1;color:var(--el-water);text-shadow:0 0 12px rgba(90,147,240,.6)">▽</span>
              <span style="font-family:'Cinzel',serif;font-size:calc(8.5px * var(--ui-scale,1));letter-spacing:.12em;text-transform:uppercase;color:var(--c-soft)">Discord</span>
            </div>
            <div data-pill="wind" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 10px;white-space:nowrap;color:var(--c-text)">
              <span style="font-size:calc(21px * var(--ui-scale,1));line-height:1;color:var(--el-wind);text-shadow:0 0 12px rgba(47,214,198,.6)">○</span>
              <span style="font-family:'Cinzel',serif;font-size:calc(8.5px * var(--ui-scale,1));letter-spacing:.12em;text-transform:uppercase;color:var(--c-soft)">Browser</span>
            </div>
            <div data-pill="earth" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 10px;white-space:nowrap;color:var(--c-text)">
              <span style="font-size:calc(21px * var(--ui-scale,1));line-height:1;color:var(--el-earth);text-shadow:0 0 12px rgba(199,154,76,.55)">□</span>
              <span style="font-family:'Cinzel',serif;font-size:calc(8.5px * var(--ui-scale,1));letter-spacing:.12em;text-transform:uppercase;color:var(--c-soft)">Files</span>
            </div>
          </div>
        </div>

        <!-- Inscribe button (central; the desktop cast-glyph hit-rect) -->
        <div id="castGlyph" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 24px;border-radius:16px;border:1px solid var(--c-gold);background:linear-gradient(180deg, rgba(156,111,42,.22), rgba(156,111,42,.08)), var(--c-panel);backdrop-filter:blur(9px);color:var(--c-text);box-shadow:0 10px 34px rgba(8,6,14,.32)">
          <span style="font-size:calc(23px * var(--ui-scale,1));color:var(--c-gold);line-height:1">⚝</span>
          <span style="font-family:'Cinzel',serif;font-size:calc(10px * var(--ui-scale,1));letter-spacing:.22em;text-transform:uppercase;font-weight:600">Inscribe</span>
        </div>

        <!-- Right controls (Tower of Tomes + Day/Night) -->
        <div style="display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:16px;border:1px solid var(--c-edge);background:var(--c-panel);backdrop-filter:blur(9px);box-shadow:0 10px 34px rgba(8,6,14,.32)">
          <div id="tomesBtn" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 9px;white-space:nowrap;color:var(--c-text)">
            <span style="font-size:calc(20px * var(--ui-scale,1));line-height:1;color:var(--c-gold)">❧</span>
            <span style="font-family:'Cinzel',serif;font-size:calc(8px * var(--ui-scale,1));letter-spacing:.12em;text-transform:uppercase;color:var(--c-soft)">Tomes</span>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 9px;white-space:nowrap;color:var(--c-text)" id="modeIndicator">
            <span style="font-size:calc(19px * var(--ui-scale,1));line-height:1;color:var(--c-gold)">☾</span>
            <span style="font-family:'Cinzel',serif;font-size:calc(8px * var(--ui-scale,1));letter-spacing:.12em;text-transform:uppercase;color:var(--c-soft)">Night</span>
          </div>
        </div>
      </div>

      <!-- Quiet-hours "embers" scrim (13.3): an eased dim over the whole scene during
           the configured night window. Pure CSS opacity transition so it works on
           static secondary monitors too; never takes input. -->
      <div id="quiet" style="position:absolute;inset:0;pointer-events:none;z-index:90;background:#05040a;opacity:0;transition:opacity 4s ease"></div>
    </div>
    <script type="module" src="/src/wallpaper.ts"></script>
  </body>
</html>
